" data-x="13.5" data-y="0" cx="482.5623735670938" cy="326.60822656776804" r="4.531355360755226" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.03310267857142857"/><circle data-type="circle" data-label="" data-x="15.5" data-y="0" cx="542.9804450438302" cy="326.60822656776804" r="4.531355360755226" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.03310267857142857"/><circle data-type="circle" data-label="" data-x="14.5" data-y="0" cx="512.7714093054619" cy="326.60822656776804" r="6.6459878624409985" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.03310267857142857"/><text data-type="text" data-label="Before: top trace at pad" data-x="2" data-y="1.9375" x="135.15846257585977" y="268.0782198246797" fill="black" font-size="13.216453135536076" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: top trace at pad</text><text data-type="text" data-label="Interior run moved" data-x="8.25" data-y="1.9375" x="323.9649359406609" y="268.0782198246797" fill="black" font-size="13.216453135536076" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Interior run moved</text><text data-type="text" data-label="After: zero DRC errors" data-x="14.5" data-y="1.9375" x="512.7714093054619" y="268.0782198246797" fill="black" font-size="13.216453135536076" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: zero DRC errors</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":30.209035738368176,"c":0,"e":74.74039109912343,"b":0,"d":-30.209035738368176,"f":326.60822656776804};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>