<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-7.971943399220503,-2.025368918611031 -7.903546787356061,-2.071626484677535" data-type="line" data-label="source_trace_268 z0" points="55.71169643651774,222.20659442217743 94.01379908060608,248.1108314194198" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.903546787356061,-2.071626484677535 -7.903442238441683,-2.070711593619866" data-type="line" data-label="source_trace_268 z0" points="94.01379908060608,248.1108314194198 94.07234647265705,247.59849242712494" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.903442238441683,-2.070711593619866 -7.9805865741746835,-2.006904220062391" data-type="line" data-label="source_trace_268 z0" points="94.07234647265705,247.59849242712494 50.87151846217694,211.86636323493894" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.778512297934375,-1.858389202362271 -7.778512297934375,-1.858389202362271" data-type="line" data-label="source_trace_258__source_trace_259_mst1 z1" points="164.03311315675,128.69795332287185 164.03311315675,128.69795332287185" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.674224335072627,-2.579999 -7.667492643794483,-2.5867306912781443" data-type="line" data-label="source_trace_258__source_trace_259_mst1 z0" points="222.43437235932925,532.79944 226.20411947509,536.5691871157608" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.667492643794483,-2.5867306912781443 -7.828269308721855,-2.5867306912781443" data-type="line" data-label="source_trace_258__source_trace_259_mst1 z0" points="226.20411947509,536.5691871157608 136.1691871157609,536.5691871157608" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.296,-1.727 -7.361,-1.795" data-type="line" data-label="source_net_6_mst2 z1" points="434.2399999999998,55.120000000000005 397.84000000000015,93.19999999999993" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.361,-1.795 -7.403,-1.832" data-type="line" data-label="source_net_6_mst2 z1" points="397.84000000000015,93.19999999999993 374.3200000000006,113.92000000000007" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.403,-1.832 -7.397,-1.836" data-type="line" data-label="source_net_6_mst2 z1" points="374.3200000000006,113.92000000000007 377.6800000000003,116.16000000000008" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.397,-1.836 -7.539211221009048,-2.1661494750746786" data-type="line" data-label="source_net_6_mst2 z1" points="377.6800000000003,116.16000000000008 298.0417162349331,301.0437060418201" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.539211221009048,-2.1661494750746786 -7.417578315728819,-2.3746078537510322" data-type="line" data-label="source_net_6_mst2 z0" points="298.0417162349331,301.0437060418201 366.1561431918617,417.78039810057794" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.417578315728819,-2.3746078537510322 -7.4117813288378835,-2.368245026421315" data-type="line" data-label="source_net_6_mst2 z0" points="366.1561431918617,417.78039810057794 369.4024558507854,414.21721479593634" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.4117813288378835,-2.368245026421315 -7.528757922890395,-2.14108473906587" data-type="line" data-label="source_net_6_mst2 z0" points="369.4024558507854,414.21721479593634 303.89556318137875,287.0074538768872" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.528757922890395,-2.14108473906587 -7.528757922890395,-2.14108473906587" data-type="line" data-label="source_net_6_mst2 z3" points="303.89556318137875,287.0074538768872 303.89556318137875,287.0074538768872" fill="none" stroke="rgba(124, 58, 237, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.2284446723293865,-2.486131167732869 -7.218887927628503,-2.463968886833104" data-type="line" data-label="source_net_16_mst2 z0" points="472.0709834955437,480.23345393040654 477.422760528038,467.8225766265384" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.218887927628503,-2.463968886833104 -7.209911651725452,-2.442996222939285" data-type="line" data-label="source_net_16_mst2 z0" points="477.422760528038,467.8225766265384 482.4494750337467,456.07788484599973" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="56"/></g><g><polyline data-points="-7.196616196406974,-1.7978391717518047 -7.196616196406974,-1.7978391717518047" data-type="line" data-label="source_net_16_mst2 z3" points="489.8949300120944,94.7899361810106 489.8949300120944,94.7899361810106" fill="none" stroke="rgba(124, 58, 237, 0.42)" stroke-width="56"/></g><g><rect data-type="rect" data-label="" data-x="-7.5" data-y="-2.2" x="40" y="40.00000000000006" width="560" height="559.9999999999999" fill="transparent" stroke="#64748b" stroke-width="0.0017857142857142857"/></g><circle data-type="circle" data-label="" data-x="-7.539211221009048" data-y="-2.1661494750746786" cx="298.0417162349331" cy="301.0437060418201" r="126" fill="rgba(17, 24, 39, 0.15)" stroke="#111827" stroke-width="0.0017857142857142857"/><circle data-type="circle" data-label="" data-x="-7.528757922890395" data-y="-2.14108473906587" cx="303.89556318137875" cy="287.0074538768872" r="126" fill="rgba(17, 24, 39, 0.15)" stroke="#111827" stroke-width="0.0017857142857142857"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":560,"c":0,"e":4520,"b":0,"d":-560,"f":-912};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>