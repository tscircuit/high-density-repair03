r: B z1" points="131.84380305602718,326.6553480475382 131.84380305602718,288.6247877758914" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="3.8030560271646863"/></g><g><polyline data-points="5,-1 5,0.035" data-type="line" data-label="repaired geometry: B z0" points="321.99660441426147,364.68590831918505 321.99660441426147,325.32427843803055" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.8030560271646863"/></g><g><polyline data-points="5,0.035 5,1" data-type="line" data-label="repaired geometry: B z1" points="321.99660441426147,325.32427843803055 321.99660441426147,288.6247877758914" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="3.8030560271646863"/></g><g><polyline data-points="10,-1 10,0.035" data-type="line" data-label="after repair: B z0" points="512.1494057724958,364.68590831918505 512.1494057724958,325.32427843803055" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.8030560271646863"/></g><g><polyline data-points="10,0.035 10,1" data-type="line" data-label="after repair: B z1" points="512.1494057724958,325.32427843803055 512.1494057724958,288.6247877758914" fill="none" stroke="rgba(220, 38, 38, 0.42)" stroke-width="3.8030560271646863"/></g><g><rect data-type="rect" data-label="board bounds" data-x="0" data-y="0" x="55.78268251273346" y="250.5942275042445" width="152.12224108658745" height="152.12224108658745" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.026294642857142853"/></g><g><rect data-type="rect" data-label="board bounds" data-x="5" data-y="0" x="245.93548387096774" y="250.5942275042445" width="152.12224108658742" height="152.12224108658745" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.026294642857142853"/></g><g><rect data-type="rect" data-label="board bounds" data-x="10" data-y="0" x="436.08828522920203" y="250.5942275042445" width="152.1222410865875" height="152.12224108658745" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.026294642857142853"/></g><circle data-type="circle" data-label="" data-x="-0.3" data-y="0" cx="120.43463497453313" cy="326.6553480475382" r="8.36672325976231" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="0" data-y="0.3" cx="131.84380305602718" cy="315.24617996604417" r="8.36672325976231" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="0.3" data-y="0" cx="143.25297113752123" cy="326.6553480475382" r="8.36672325976231" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.3" cx="131.84380305602718" cy="338.06451612903226" r="8.36672325976231" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="5" data-y="-1" cx="321.99660441426147" cy="364.68590831918505" r="5.704584040747029" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="5" data-y="0.035" cx="321.99660441426147" cy="325.32427843803055" r="5.704584040747029" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="10" data-y="-1" cx="512.1494057724958" cy="364.68590831918505" r="5.704584040747029" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="10" data-y="0.035" cx="512.1494057724958" cy="325.32427843803055" r="5.704584040747029" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="9.7" data-y="0" cx="500.7402376910017" cy="326.6553480475382" r="8.36672325976231" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="10" data-y="0.3" cx="512.1494057724958" cy="315.24617996604417" r="8.36672325976231" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="10.3" data-y="0" cx="523.5585738539899" cy="326.6553480475382" r="8.36672325976231" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.026294642857142853"/><circle data-type="circle" data-label="" data-x="10" data-y="-0.3" cx="512.1494057724958" cy="338.06451612903226" r="8.36672325976231" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.026294642857142853"/><text data-type="text" data-label="Before: four DRC errors" data-x="0" data-y="2.35" x="131.84380305602718" y="237.28353140916806" fill="black" font-size="13.310696095076404" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: four DRC errors</text><text data-type="text" data-label="Trace-pair layer move" data-x="5" data-y="2.35" x="321.99660441426147" y="237.28353140916806" fill="black" font-size="13.310696095076404" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Trace-pair layer move</text><text data-type="text" data-label="After: zero DRC errors" data-x="10" data-y="2.35" x="512.1494057724958" y="237.28353140916806" fill="black" font-size="13.310696095076404" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: zero DRC errors</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":38.03056027164686,"c":0,"e":131.84380305602718,"b":0,"d":-38.03056027164686,"f":326.6553480475382};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
