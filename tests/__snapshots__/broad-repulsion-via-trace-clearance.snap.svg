50000000000001" data-y="5.523125" x="376.9395558054541" y="40.00000000000023" fill="black" font-size="15.788585886983414" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before fix: 0.083 mm clearance (FAIL)</text><text data-type="text" data-label="After fix: 0.111 mm clearance (PASS)" data-x="8.175" data-y="5.523125" x="727.7970199606409" y="40.00000000000023" fill="black" font-size="15.788585886983414" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After fix: 0.111 mm clearance (PASS)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="560" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '560');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":215.91228563396115,"c":0,"e":-1037.2859150969916,"b":0,"d":-215.91228563396115,"f":1232.510542592072};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>