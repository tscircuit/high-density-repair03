one" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.172417469430634,0.561586103494511 -18.17173984231088,0.5612178003335008" data-type="line" data-label="" points="687.7957263829676,120.65488565320885 687.9863049515179,120.75846871116494" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.17173984231088,0.5612178003335008 -18.17173984231088,0.5606071023576503" data-type="line" data-label="" points="687.9863049515179,120.75846871116494 687.9863049515179,120.93022385888804" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.17173984231088,0.5606071023576503 -18.172417469430634,0.5602387288991157" data-type="line" data-label="" points="687.9863049515179,120.93022385888804 687.7957263829676,121.03382668760179" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.172417469430634,0.5602387288991157 -18.152639640803994,-0.5418821953352004" data-type="line" data-label="" points="687.7957263829676,121.03382668760179 693.3581222181265,430.9987350974611" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.152639640803994,-0.5418821953352004 -18.172413727757444,-0.545" data-type="line" data-label="" points="693.3581222181265,430.9987350974611 687.7967787061398,431.87559898427634" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><polyline data-points="-18.172413727757444,-0.545 -17.999697221348008,-0.645" data-type="line" data-label="" points="687.7967787061398,431.87559898427634 736.3722615890774,460" fill="none" stroke="#dc2626" stroke-width="28.12440101572369"/></g><g><rect data-type="rect" data-label="Expanded routing obstacle" data-x="-19.49" data-y="0" x="224.4230084206315" y="171.72488958883218" width="185.6210467037754" height="213.74544771950002" fill="#94a3b820" stroke="#64748b" stroke-width="0.0035556312806126022"/></g><g><rect data-type="rect" data-label="Actual pad copper" data-x="-19.49" data-y="0" x="241.29764903006526" y="188.5995301982664" width="151.87176548490788" height="179.9961665006316" fill="#fbbf2460" stroke="#a16207" stroke-width="0.0035556312806126022"/></g><g><rect data-type="rect" data-label="Expanded routing obstacle" data-x="-17.95052730541024" data-y="0" x="657.3904825746217" y="171.72488958883218" width="185.6210467037754" height="213.74544771950002" fill="#94a3b820" stroke="#64748b" stroke-width="0.0035556312806126022"/></g><g><rect data-type="rect" data-label="Actual pad copper" data-x="-17.95052730541024" data-y="0" x="674.2651231840559" y="188.5995301982664" width="151.87176548490697" height="179.9961665006316" fill="#fbbf2460" stroke="#a16207" stroke-width="0.0035556312806126022"/></g><text data-type="text" data-label="Before repair: copper is separate" data-x="-19.244634550186888" data-y="0.8185901001732239" x="386.241094831993" y="48.37405100085044" fill="black" font-size="20.05034024504494" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before repair: copper is separate</text><text data-type="text" data-label="After repair: 1 pad overlap(s)" data-x="-17.660376395471165" data-y="0.848365137857293" x="831.8042113885467" y="40" fill="black" font-size="20.05034024504494" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After repair: 1 pad overlap(s)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":281.2440101572369,"c":0,"e":5798.679289737066,"b":0,"d":-281.2440101572369,"f":278.5976134485822};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
