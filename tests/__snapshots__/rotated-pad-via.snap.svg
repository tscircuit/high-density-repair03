<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1,-0.5 1,-0.5 1,0.5 -1,0.5 -1,-0.5" data-type="line" data-label="Old model ignored pad rotation" points="154.89614243323447,387.7151335311573 439.76261127596445,387.7151335311573 439.76261127596445,245.28189910979228 154.89614243323447,245.28189910979228 154.89614243323447,387.7151335311573" fill="none" stroke="#64748b" stroke-width="3.5608308605341246" stroke-dasharray="5 4"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="-0.05" x="55.192878338279" y="67.24035608308606" width="484.2729970326409" height="512.7596439169139" fill="transparent" stroke="transparent" stroke-width="0.007020833333333334"/></g><g><rect data-type="rect" data-label="Actual rectangular copper (unchanged)" data-x="0" data-y="0" data-ccw-rotation-degrees="45" x="154.8961424332345" y="245.2818991097923" width="284.8664688427299" height="142.43323442136494" fill="rgba(234, 179, 8, 0.25)" stroke="#a16207" stroke-width="0.007020833333333334" transform="rotate(-45.000000 297.32937685459945 316.4985163204748)"/></g><g><rect data-type="rect" data-label="" data-x="4.25" data-y="-0.05" x="660.5341246290802" y="67.24035608308606" width="484.2729970326408" height="512.7596439169139" fill="transparent" stroke="transparent" stroke-width="0.007020833333333334"/></g><g><rect data-type="rect" data-label="Actual rectangular copper (unchanged)" data-x="4.25" data-y="0" data-ccw-rotation-degrees="45" x="760.2373887240356" y="245.28189910979228" width="284.86646884273" height="142.43323442136503" fill="rgba(234, 179, 8, 0.25)" stroke="#a16207" stroke-width="0.007020833333333334" transform="rotate(-45.000000 902.6706231454006 316.4985163204748)"/></g><circle data-type="circle" data-label="" data-x="0.3535533905932737" data-y="1.2586500705120545" cx="347.6871298174396" cy="137.22491577276378" r="21.364985163204746" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.007020833333333334"/><circle data-type="circle" data-label="" data-x="0.3535533905932737" data-y="1.2586500705120545" cx="347.6871298174396" cy="137.22491577276378" r="9.258160237388724" fill="white" stroke="#1d4ed8" stroke-width="0.007020833333333334"/><circle data-type="circle" data-label="" data-x="4.603553390593274" data-y="1.2586500705120545" cx="953.0283761082408" cy="137.22491577276378" r="21.364985163204746" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.007020833333333334"/><circle data-type="circle" data-label="" data-x="4.603553390593274" data-y="1.2586500705120545" cx="953.0283761082408" cy="137.22491577276378" r="9.258160237388724" fill="white" stroke="#1d4ed8" stroke-width="0.007020833333333334"/><circle data-type="circle" data-label="" data-x="4.603553390593274" data-y="1.2586500705120545" cx="953.0283761082408" cy="137.22491577276378" r="35.60830860534124" fill="transparent" stroke="#dc2626" stroke-width="0.007020833333333334"/><text data-type="text" data-label="Gray outline: incorrect old pad model" data-x="0" data-y="-1.5" x="297.32937685459945" y="530.1483679525222" fill="#475569" font-size="14.243323442136498" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gray outline: incorrect old pad model</text><text data-type="text" data-label="Gold: actual pad | Blue: foreign-net copper" data-x="0" data-y="-1.68" x="297.32937685459945" y="555.7863501483679" fill="#475569" font-size="12.818991097922847" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gold: actual pad | Blue: foreign-net copper</text><text data-type="text" data-label="Gap 0.048 mm vs 0.100 mm minimum" data-x="4.25" data-y="-1.5" x="902.6706231454006" y="530.1483679525222" fill="#b91c1c" font-size="14.243323442136498" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gap 0.048 mm vs 0.100 mm minimum</text><text data-type="text" data-label="Gold: actual pad | Blue: foreign-net copper" data-x="4.25" data-y="-1.68" x="902.6706231454006" y="555.7863501483679" fill="#475569" font-size="12.818991097922847" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gold: actual pad | Blue: foreign-net copper</text><text data-type="text" data-label="Before: violation missed" data-x="0" data-y="1.9412500000000001" x="297.32937685459945" y="40" fill="black" font-size="27.240356083086056" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: violation missed</text><text data-type="text" data-label="After: violation detected" data-x="4.25" data-y="1.9412500000000001" x="902.6706231454006" y="40" fill="black" font-size="27.240356083086056" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: violation detected</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="620" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '620');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":142.43323442136497,"c":0,"e":297.32937685459945,"b":0,"d":-142.43323442136497,"f":316.4985163204748};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>