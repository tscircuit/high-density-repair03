idth="16.296296296296298"/></g><g><polyline data-points="2.5,-0.5 4.65,0.15000000000000002" data-type="line" data-label="escape" points="789.6296296296297,439.8333333333333 1140,333.9074074074074" fill="none" stroke="#d4a000" stroke-width="16.296296296296298" stroke-dasharray="0.12 0.08"/></g><g><polyline data-points="4.65,0.15000000000000002 4.5,0" data-type="line" data-label="escape" points="1140,333.9074074074074 1115.5555555555557,358.35185185185185" fill="none" stroke="red" stroke-width="16.296296296296298"/></g><g><polyline data-points="3,0.3 6,0.3" data-type="line" data-label="fixed" points="871.1111111111112,309.46296296296293 1360,309.46296296296293" fill="none" stroke="green" stroke-width="16.296296296296298" stroke-dasharray="0.12 0.08"/></g><circle data-type="circle" data-label="" data-x="-0.4" data-y="-0.4" cx="317.03703703703707" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="0" cx="317.03703703703707" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="0.4" cx="317.03703703703707" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.4" cx="382.2222222222223" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="382.2222222222223" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0" data-y="0.4" cx="382.2222222222223" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0.4" data-y="-0.4" cx="447.4074074074075" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0.4" data-y="0" cx="447.4074074074075" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0.4" data-y="0.4" cx="447.4074074074075" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="-2" data-y="-0.5" cx="56.29629629629636" cy="439.8333333333333" r="16.296296296296298" fill="blue" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="0" data-y="0.8" cx="382.2222222222223" cy="227.98148148148147" r="16.296296296296298" fill="blue" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.1" data-y="-0.4" cx="1050.3703703703704" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.1" data-y="0" cx="1050.3703703703704" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.1" data-y="0.4" cx="1050.3703703703704" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.5" data-y="-0.4" cx="1115.5555555555557" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.5" data-y="0" cx="1115.5555555555557" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.5" data-y="0.4" cx="1115.5555555555557" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.9" data-y="-0.4" cx="1180.7407407407409" cy="423.53703703703707" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.9" data-y="0" cx="1180.7407407407409" cy="358.35185185185185" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.9" data-y="0.4" cx="1180.7407407407409" cy="293.16666666666663" r="16.296296296296298" fill="rgba(255, 0, 0, 0.2)" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="2.5" data-y="-0.5" cx="789.6296296296297" cy="439.8333333333333" r="16.296296296296298" fill="blue" stroke="black" stroke-width="0.006136363636363636"/><circle data-type="circle" data-label="" data-x="4.65" data-y="0.15000000000000002" cx="1140" cy="333.9074074074074" r="16.296296296296298" fill="blue" stroke="black" stroke-width="0.006136363636363636"/><text data-type="text" data-label="Before: 3 DRC errors" data-x="-0.30000000000000004" data-y="1.1025" x="333.33333333333337" y="178.6851851851852" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: 3 DRC errors</text><text data-type="text" data-label="After: 0 DRC errors" data-x="4.2" data-y="0.7025" x="1066.6666666666667" y="243.87037037037038" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: 0 DRC errors</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":162.96296296296296,"c":0,"e":382.2222222222223,"b":0,"d":-162.96296296296296,"f":358.35185185185185};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>