,255.08825526137136 1040.135777325187,255.08825526137136" fill="none" stroke="#dc2626" stroke-width="8.276985743380854"/></g><g><rect data-type="rect" data-label="board bounds" data-x="0" data-y="0" x="40" y="82.65105227427023" width="344.8744059742023" height="344.87440597420226" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007249015748031497"/></g><g><rect data-type="rect" data-label="board bounds" data-x="3.125" data-y="0" x="471.0930074677528" y="82.65105227427023" width="344.8744059742022" height="344.87440597420226" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007249015748031497"/></g><g><rect data-type="rect" data-label="close-up bounds" data-x="6.25" data-y="0" x="902.1860149355057" y="82.65105227427023" width="344.8744059742021" height="344.87440597420226" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007249015748031497"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="212.43720298710116" cy="255.08825526137136" r="15.174473862864899" fill="rgba(37, 99, 235, 0.3)" stroke="#2563eb" stroke-width="0.007249015748031497"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="212.43720298710116" cy="255.08825526137136" r="22.76171079429735" fill="rgba(124, 58, 237, 0.2)" stroke="#7c3aed" stroke-width="0.007249015748031497"/><circle data-type="circle" data-label="" data-x="2.9899999999999998" data-y="0" cx="624.9069925322469" cy="255.08825526137136" r="15.174473862864899" fill="rgba(37, 99, 235, 0.3)" stroke="#2563eb" stroke-width="0.007249015748031497"/><circle data-type="circle" data-label="" data-x="2.985" data-y="0" cx="624.2172437202986" cy="255.08825526137136" r="22.76171079429735" fill="rgba(124, 58, 237, 0.2)" stroke="#7c3aed" stroke-width="0.007249015748031497"/><circle data-type="circle" data-label="" data-x="6.499999999999997" data-y="0" cx="1109.1106585200266" cy="255.08825526137136" r="16.553971486761707" fill="rgba(37, 99, 235, 0.35)" stroke="#2563eb" stroke-width="0.007249015748031497"/><circle data-type="circle" data-label="" data-x="6.000000000000003" data-y="0" cx="1040.135777325187" cy="255.08825526137136" r="27.58995247793618" fill="rgba(124, 58, 237, 0.25)" stroke="#7c3aed" stroke-width="0.007249015748031497"/><text data-type="text" data-label="Before" data-x="0" data-y="1.46875" x="212.43720298710116" y="52.47454175152754" fill="black" font-size="30.176510522742696" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before</text><text data-type="text" data-label="After" data-x="3.125" data-y="1.46875" x="643.5302104548539" y="52.47454175152754" fill="black" font-size="30.176510522742696" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After</text><text data-type="text" data-label="BUG: 0.005 mm split (100x)" data-x="6.25" data-y="1.46875" x="1074.6232179226067" y="52.47454175152754" fill="black" font-size="30.176510522742696" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">BUG: 0.005 mm split (100x)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="480" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1350" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1350');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '480');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":137.9497623896809,"c":0,"e":212.43720298710116,"b":0,"d":-137.9497623896809,"f":255.08825526137136};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>