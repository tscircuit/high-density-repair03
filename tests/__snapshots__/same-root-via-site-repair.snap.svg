<svg width="1350" height="480" viewBox="0 0 1350 480" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1,0 0,0" data-type="line" data-label="signal_mst0 z0" points="74.00267737617136,254.87617135207498 210.01338688085679,254.87617135207498" fill="none" stroke="#2563eb" stroke-width="13.601070950468543"/></g><g><polyline data-points="0,0 1,0" data-type="line" data-label="signal_mst0 z1" points="210.01338688085679,254.87617135207498 346.0240963855422,254.87617135207498" fill="none" stroke="#2563eb" stroke-width="13.601070950468543"/></g><g><polyline data-points="0,-1 0,0" data-type="line" data-label="signal_mst1 z0" points="210.01338688085679,390.8868808567604 210.01338688085679,254.87617135207498" fill="none" stroke="#7c3aed" stroke-width="13.601070950468543"/></g><g><polyline data-points="0,0 0,1" data-type="line" data-label="signal_mst1 z1" points="210.01338688085679,254.87617135207498 210.01338688085679,118.86546184738955" fill="none" stroke="#7c3aed" stroke-width="13.601070950468543"/></g><g><polyline data-points="0.18,-1 0.18,1" data-type="line" data-label="foreign z0" points="234.49531459170015,390.8868808567604 234.49531459170015,118.86546184738955" fill="none" stroke="#dc2626" stroke-width="13.601070950468543"/></g><g><polyline data-points="2.125,0 2.9899999999999998,0" data-type="line" data-label="signal_mst0 z0" points="499.0361445783133,254.87617135207498 616.6854082998661,254.87617135207498" fill="none" stroke="#2563eb" stroke-width="13.601070950468543"/></g><g><polyline data-points="2.9899999999999998,0 4.125,0" data-type="line" data-label="signal_mst0 z1" points="616.6854082998661,254.87617135207498 771.0575635876842,254.87617135207498" fill="none" stroke="#2563eb" stroke-width="13.601070950468543"/></g><g><polyline data-points="3.125,-1 2.9899999999999998,0" data-type="line" data-label="signal_mst1 z0" points="635.0468540829987,390.8868808567604 616.6854082998661,254.87617135207498" fill="none" stroke="#7c3aed" stroke-width="13.601070950468543"/></g><g><polyline data-points="2.9899999999999998,0 3.125,1" data-type="line" data-label="signal_mst1 z1" points="616.6854082998661,254.87617135207498 635.0468540829987,118.86546184738955" fill="none" stroke="#7c3aed" stroke-width="13.601070950468543"/></g><g><polyline data-points="3.305,-1 3.305,1" data-type="line" data-label="foreign z0" points="659.5287817938422,390.8868808567604 659.5287817938422,118.86546184738955" fill="none" stroke="#dc2626" stroke-width="13.601070950468543"/></g><g><polyline data-points="5.25,0 7.25,0" data-type="line" data-label="close-up x axis" points="924.0696117804553,254.87617135207498 1196.0910307898262,254.87617135207498" fill="none" stroke="#cbd5e1" stroke-width="2.7202141900937087"/></g><g><rect data-type="rect" data-label="board bounds" data-x="0" data-y="0" x="40" y="84.86278447121819" width="340.02677376171357" height="340.02677376171357" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007352362204724409"/></g><g><rect data-type="rect" data-label="board bounds" data-x="3.125" data-y="0" x="465.033467202142" y="84.86278447121819" width="340.02677376171346" height="340.02677376171357" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007352362204724409"/></g><g><rect data-type="rect" data-label="close-up bounds" data-x="6.25" data-y="0" x="890.0669344042839" y="84.86278447121819" width="340.02677376171346" height="340.02677376171357" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.007352362204724409"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="210.01338688085679" cy="254.87617135207498" r="14.961178045515396" fill="rgba(37, 99, 235, 0.3)" stroke="#2563eb" stroke-width="0.007352362204724409"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="210.01338688085679" cy="254.87617135207498" r="22.441767068273094" fill="rgba(124, 58, 237, 0.2)" stroke="#7c3aed" stroke-width="0.007352362204724409"/><circle data-type="circle" data-label="" data-x="2.9899999999999998" data-y="0" cx="616.6854082998661" cy="254.87617135207498" r="14.961178045515396" fill="rgba(37, 99, 235, 0.3)" stroke="#2563eb" stroke-width="0.007352362204724409"/><circle data-type="circle" data-label="" data-x="2.9899999999999998" data-y="0" cx="616.6854082998661" cy="254.87617135207498" r="22.441767068273094" fill="rgba(124, 58, 237, 0.2)" stroke="#7c3aed" stroke-width="0.007352362204724409"/><circle data-type="circle" data-label="" data-x="6.25" data-y="0" cx="1060.0803212851406" cy="254.87617135207498" r="16.32128514056225" fill="rgba(37, 99, 235, 0.35)" stroke="#2563eb" stroke-width="0.007352362204724409"/><circle data-type="circle" data-label="" data-x="6.25" data-y="0" cx="1060.0803212851406" cy="254.87617135207498" r="27.202141900937086" fill="rgba(124, 58, 237, 0.25)" stroke="#7c3aed" stroke-width="0.007352362204724409"/><text data-type="text" data-label="Before" data-x="0" data-y="1.46875" x="210.01338688085679" y="55.11044176706827" fill="black" font-size="29.752342704149935" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before</text><text data-type="text" data-label="After" data-x="3.125" data-y="1.46875" x="635.0468540829987" y="55.11044176706827" fill="black" font-size="29.752342704149935" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After</text><text data-type="text" data-label="FIX: copies colocated (100x)" data-x="6.25" data-y="1.46875" x="1060.0803212851406" y="55.11044176706827" fill="black" font-size="29.752342704149935" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">FIX: copies colocated (100x)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="480" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1350" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1350');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '480');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":136.01070950468542,"c":0,"e":210.01338688085679,"b":0,"d":-136.01070950468542,"f":254.87617135207498};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>