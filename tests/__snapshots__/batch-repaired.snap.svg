<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,-1 0,0.24000000000000005" data-type="line" data-label="A z0" points="145,565 145,521.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,0.24000000000000005 5,0.24000000000000005" data-type="line" data-label="A z0" points="145,521.6 320,521.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="5,0.24000000000000005 10,0.24000000000000005" data-type="line" data-label="A z0" points="320,521.6 495,521.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="10,0.24000000000000005 10,-1" data-type="line" data-label="A z0" points="495,521.6 495,565" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,3 0,4.24" data-type="line" data-label="B z0" points="145,425 145,381.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,4.24 5,4.24" data-type="line" data-label="B z0" points="145,381.6 320,381.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="5,4.24 10,4.24" data-type="line" data-label="B z0" points="320,381.6 495,381.6" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="10,4.24 10,3" data-type="line" data-label="B z0" points="495,381.6 495,425" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,7 0,8.24" data-type="line" data-label="C z0" points="145,285 145,241.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,8.24 5,8.24" data-type="line" data-label="C z0" points="145,241.59999999999997 320,241.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="5,8.24 10,8.24" data-type="line" data-label="C z0" points="320,241.59999999999997 495,241.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="10,8.24 10,7" data-type="line" data-label="C z0" points="495,241.59999999999997 495,285" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,11 0,12.24" data-type="line" data-label="D z0" points="145,145 145,101.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="0,12.24 5,12.24" data-type="line" data-label="D z0" points="145,101.59999999999997 320,101.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="5,12.24 10,12.24" data-type="line" data-label="D z0" points="320,101.59999999999997 495,101.59999999999997" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><polyline data-points="10,12.24 10,11" data-type="line" data-label="D z0" points="495,101.59999999999997 495,145" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="3.5"/></g><g><rect data-type="rect" data-label="board bounds" data-x="5" data-y="6" x="110" y="40" width="420" height="560" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="pad_a" data-x="2" data-y="0" x="197.5" y="512.5" width="35" height="35" fill="rgba(148, 163, 184, 0.58)" stroke="#64748b" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="pad_b" data-x="8" data-y="4" x="407.5" y="372.5" width="35" height="35" fill="rgba(148, 163, 184, 0.58)" stroke="#64748b" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="pad_c" data-x="2" data-y="8" x="197.5" y="232.5" width="35" height="35" fill="rgba(148, 163, 184, 0.58)" stroke="#64748b" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="pad_d" data-x="8" data-y="12" x="407.5" y="92.5" width="35" height="35" fill="rgba(148, 163, 184, 0.58)" stroke="#64748b" stroke-width="0.02857142857142857"/></g><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="215" cy="530" r="7.7" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.02857142857142857"/><circle data-type="circle" data-label="" data-x="8" data-y="4" cx="425" cy="390" r="7.7" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.02857142857142857"/><circle data-type="circle" data-label="" data-x="2" data-y="8" cx="215" cy="250" r="7.7" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.02857142857142857"/><circle data-type="circle" data-label="" data-x="8" data-y="12" cx="425" cy="110" r="7.7" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.02857142857142857"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":35,"c":0,"e":145,"b":0,"d":-35,"f":530};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>