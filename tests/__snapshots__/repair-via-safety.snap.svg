cy="397.5" r="32.85333333333333" fill="transparent" stroke="#dc2626" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="0.5" data-y="0.125" cx="392.00000000000006" cy="397.5" r="32.85333333333333" fill="transparent" stroke="#dc2626" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="5.75" data-y="-0.055999999999999994" cx="1008" cy="418.73733333333337" r="17.599999999999998" fill="#ea580c" stroke="#9a3412" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="5.75" data-y="-0.055999999999999994" cx="1008" cy="418.73733333333337" r="7.039999999999999" fill="white" stroke="#9a3412" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="6.75" data-y="-0.055999999999999994" cx="1125.3333333333335" cy="418.73733333333337" r="17.599999999999998" fill="#ea580c" stroke="#9a3412" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="6.75" data-y="-0.055999999999999994" cx="1125.3333333333335" cy="418.73733333333337" r="7.039999999999999" fill="white" stroke="#9a3412" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="5.75" data-y="-0.055999999999999994" cx="1008" cy="418.73733333333337" r="26.986666666666668" fill="transparent" stroke="#16a34a" stroke-width="0.008522727272727274"/><circle data-type="circle" data-label="" data-x="6.75" data-y="-0.055999999999999994" cx="1125.3333333333335" cy="418.73733333333337" r="26.986666666666668" fill="transparent" stroke="#16a34a" stroke-width="0.008522727272727274"/><text data-type="text" data-label="ONE REPAIR ITERATION — same crossing input" data-x="0" data-y="2.38" x="333.33333333333337" y="132.91333333333336" fill="#475569" font-size="15.253333333333334" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ONE REPAIR ITERATION — same crossing input</text><text data-type="text" data-label="2 new via-pad violations: gap 0.050 vs required 0.100 mm" data-x="0" data-y="-2.38" x="333.33333333333337" y="691.4200000000001" fill="#b91c1c" font-size="15.253333333333334" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2 new via-pad violations: gap 0.050 vs required 0.100 mm</text><text data-type="text" data-label="Blue / purple: top traces | Orange: bottom trace + vias" data-x="0" data-y="-2.63" x="333.33333333333337" y="720.7533333333333" fill="#475569" font-size="12.906666666666666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Blue / purple: top traces | Orange: bottom trace + vias</text><text data-type="text" data-label="Gold: foreign bottom pads | Red rings: DRC conflicts" data-x="0" data-y="-2.86" x="333.33333333333337" y="747.74" fill="#475569" font-size="12.906666666666666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gold: foreign bottom pads | Red rings: DRC conflicts</text><text data-type="text" data-label="ONE REPAIR ITERATION — same crossing input" data-x="6.25" data-y="2.38" x="1066.6666666666665" y="132.91333333333336" fill="#475569" font-size="15.253333333333334" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ONE REPAIR ITERATION — same crossing input</text><text data-type="text" data-label="Layer change + clear via placement: zero DRC errors" data-x="6.25" data-y="-2.38" x="1066.6666666666665" y="691.4200000000001" fill="#15803d" font-size="15.253333333333334" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Layer change + clear via placement: zero DRC errors</text><text data-type="text" data-label="Blue / purple: top traces | Orange: bottom trace + vias" data-x="6.25" data-y="-2.63" x="1066.6666666666665" y="720.7533333333333" fill="#475569" font-size="12.906666666666666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Blue / purple: top traces | Orange: bottom trace + vias</text><text data-type="text" data-label="Gold: foreign bottom pads | Green rings: clear vias" data-x="6.25" data-y="-2.86" x="1066.6666666666665" y="747.74" fill="#475569" font-size="12.906666666666666" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gold: foreign bottom pads | Green rings: clear vias</text><text data-type="text" data-label="Before: unsafe vias" data-x="0" data-y="2.88125" x="333.33333333333337" y="74.10000000000002" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: unsafe vias</text><text data-type="text" data-label="After: clear traces and vias" data-x="6.25" data-y="2.88125" x="1066.6666666666665" y="74.10000000000002" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: clear traces and vias</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="850" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '850');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":117.33333333333333,"c":0,"e":333.33333333333337,"b":0,"d":-117.33333333333333,"f":412.1666666666667};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>