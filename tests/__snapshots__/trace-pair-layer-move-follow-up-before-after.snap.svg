9999999999999" cy="300.3333333333333" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="1" data-y="-1" cx="119.99999999999999" cy="327" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="93.33333333333331" cy="300.3333333333333" r="5.866666666666667" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="6.5" data-y="0" cx="266.66666666666663" cy="300.3333333333333" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="8.57" data-y="-1" cx="321.8666666666667" cy="327" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="14" data-y="0" cx="466.6666666666667" cy="300.3333333333333" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="16.07" data-y="-1" cx="521.8666666666667" cy="327" r="4" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(248, 250, 252, 0.5)" stroke-width="0.0375"/><circle data-type="circle" data-label="" data-x="15" data-y="0" cx="493.3333333333333" cy="300.3333333333333" r="5.866666666666667" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.0375"/><text data-type="text" data-label="Before repair" data-x="1" data-y="2.525" x="119.99999999999999" y="233" fill="black" font-size="14.000000000000002" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before repair</text><text data-type="text" data-label="Layer move + follow-up" data-x="8.5" data-y="2.525" x="320" y="233" fill="black" font-size="14.000000000000002" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Layer move + follow-up</text><text data-type="text" data-label="After repair" data-x="16" data-y="2.525" x="520" y="233" fill="black" font-size="14.000000000000002" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After repair</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":26.666666666666668,"c":0,"e":93.33333333333331,"b":0,"d":-26.666666666666668,"f":300.3333333333333};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
