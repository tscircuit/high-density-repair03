<svg width="1500" height="600" viewBox="0 0 1500 600" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 4,0" data-type="line" data-label="a" points="185.3700787401574,396.2204724409449 512.9291338582677,396.2204724409449" fill="none" stroke="#2563eb" stroke-width="8.188976377952757"/></g><g><polyline data-points="1,-2 1,2" data-type="line" data-label="b" points="267.259842519685,560 267.259842519685,232.44094488188975" fill="none" stroke="#16a34a" stroke-width="8.188976377952757"/></g><g><polyline data-points="3,-2 3,2" data-type="line" data-label="c" points="431.0393700787401,560 431.0393700787401,232.44094488188975" fill="none" stroke="#9333ea" stroke-width="8.188976377952757"/></g><g><polyline data-points="2,1 2,4" data-type="line" data-label="d" points="349.14960629921256,314.3307086614173 349.14960629921256,68.66141732283461" fill="none" stroke="#ea580c" stroke-width="8.188976377952757"/></g><g><polyline data-points="1.5,-1 2.5,-1" data-type="line" data-label="e" points="308.2047244094488,478.1102362204725 390.09448818897636,478.1102362204725" fill="none" stroke="#0891b2" stroke-width="8.188976377952757"/></g><g><polyline data-points="1.5,-1.5 2.5,-1.5" data-type="line" data-label="f" points="308.2047244094488,519.0551181102362 390.09448818897636,519.0551181102362" fill="none" stroke="#be123c" stroke-width="8.188976377952757"/></g><g><polyline data-points="5,0 5,3 9,3 9,0" data-type="line" data-label="a" points="594.8188976377953,396.2204724409449 594.8188976377953,150.5511811023622 922.3779527559055,150.5511811023622 922.3779527559055,396.2204724409449" fill="none" stroke="#2563eb" stroke-width="8.188976377952757"/></g><g><polyline data-points="6,-2 6,2" data-type="line" data-label="b" points="676.7086614173228,560 676.7086614173228,232.44094488188975" fill="none" stroke="#16a34a" stroke-width="8.188976377952757"/></g><g><polyline data-points="8,-2 8,2" data-type="line" data-label="c" points="840.488188976378,560 840.488188976378,232.44094488188975" fill="none" stroke="#9333ea" stroke-width="8.188976377952757"/></g><g><polyline data-points="7,1 7,4" data-type="line" data-label="d" points="758.5984251968504,314.3307086614173 758.5984251968504,68.66141732283461" fill="none" stroke="#ea580c" stroke-width="8.188976377952757"/></g><g><polyline data-points="6.5,0 7.5,0" data-type="line" data-label="e" points="717.6535433070866,396.2204724409449 799.5433070866142,396.2204724409449" fill="none" stroke="#0891b2" stroke-width="8.188976377952757"/></g><g><polyline data-points="6.5,-1 7.5,-1" data-type="line" data-label="f" points="717.6535433070866,478.1102362204725 799.5433070866142,478.1102362204725" fill="none" stroke="#be123c" stroke-width="8.188976377952757"/></g><g><polyline data-points="10,0 10,3 14,3 14,0" data-type="line" data-label="a" points="1004.2677165354331,396.2204724409449 1004.2677165354331,150.5511811023622 1331.8267716535433,150.5511811023622 1331.8267716535433,396.2204724409449" fill="none" stroke="#2563eb" stroke-width="8.188976377952757"/></g><g><polyline data-points="11,-2 11,2" data-type="line" data-label="b" points="1086.1574803149606,560 1086.1574803149606,232.44094488188975" fill="none" stroke="#16a34a" stroke-width="8.188976377952757"/></g><g><polyline data-points="13,-2 13,2" data-type="line" data-label="c" points="1249.9370078740158,560 1249.9370078740158,232.44094488188975" fill="none" stroke="#9333ea" stroke-width="8.188976377952757"/></g><g><polyline data-points="12,1 12,4" data-type="line" data-label="d" points="1168.0472440944882,314.3307086614173 1168.0472440944882,68.66141732283461" fill="none" stroke="#ea580c" stroke-width="8.188976377952757"/></g><g><polyline data-points="11.5,0 12.5,0" data-type="line" data-label="e" points="1127.1023622047246,396.2204724409449 1208.992125984252,396.2204724409449" fill="none" stroke="#0891b2" stroke-width="8.188976377952757"/></g><g><polyline data-points="11.5,-1 12.5,-1" data-type="line" data-label="f" points="1127.1023622047246,478.1102362204725 1208.992125984252,478.1102362204725" fill="none" stroke="#be123c" stroke-width="8.188976377952757"/></g><text data-type="text" data-label="Input: 2 shorts (a-b, a-c)" data-x="2" data-y="4.35" x="349.14960629921256" y="40" fill="black" font-size="28.66141732283465" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Input: 2 shorts (a-b, a-c)</text><text data-type="text" data-label="Repaired: 1 short (a-d)" data-x="7" data-y="4.35" x="758.5984251968504" y="40" fill="black" font-size="28.66141732283465" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Repaired: 1 short (a-d)</text><text data-type="text" data-label="Published: 1 short (a-d)" data-x="12" data-y="4.35" x="1168.0472440944882" y="40" fill="black" font-size="28.66141732283465" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Published: 1 short (a-d)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1500" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1500');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":81.88976377952757,"c":0,"e":185.3700787401574,"b":0,"d":-81.88976377952757,"f":396.2204724409449};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>