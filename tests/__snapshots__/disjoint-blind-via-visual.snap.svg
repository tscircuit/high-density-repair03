<svg width="1100" height="550" viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="1.0899999999999999,0.4474999999999999 1.99,0.4474999999999999" data-type="line" data-label="" points="667.2869787778607,168.16359176708963 1028.1699904020477,168.16359176708963" fill="none" stroke="#cbd5e1" stroke-width="2.405886744161246"/></g><g><polyline data-points="1.0899999999999999,0.2474999999999999 1.99,0.2474999999999999" data-type="line" data-label="" points="667.2869787778607,248.35981657246447 1028.1699904020477,248.35981657246447" fill="none" stroke="#cbd5e1" stroke-width="2.405886744161246"/></g><g><polyline data-points="1.0899999999999999,0.047499999999999876 1.99,0.047499999999999876" data-type="line" data-label="" points="667.2869787778607,328.55604137783934 1028.1699904020477,328.55604137783934" fill="none" stroke="#cbd5e1" stroke-width="2.405886744161246"/></g><g><polyline data-points="1.0899999999999999,-0.1525000000000002 1.99,-0.1525000000000002" data-type="line" data-label="" points="667.2869787778607,408.75226618321426 1028.1699904020477,408.75226618321426" fill="none" stroke="#cbd5e1" stroke-width="2.405886744161246"/></g><g><polyline data-points="1.44,0.4474999999999999 1.44,0.2474999999999999" data-type="line" data-label="" points="807.6303721872667,168.16359176708963 807.6303721872667,248.35981657246447" fill="none" stroke="#2563eb" stroke-width="7.217660232483738"/></g><g><polyline data-points="1.64,0.047499999999999876 1.64,-0.1525000000000002" data-type="line" data-label="" points="887.8265969926416,328.55604137783934 887.8265969926416,408.75226618321426" fill="none" stroke="#9333ea" stroke-width="7.217660232483738"/></g><g><rect data-type="rect" data-label="upper" data-x="1.44" data-y="0.4474999999999999" x="747.4832035832356" y="161.14642209661935" width="120.29433720806219" height="14.03433934094059" fill="#2563eb" stroke="black" stroke-width="0.0024938829787234038"/></g><g><rect data-type="rect" data-label="upper" data-x="1.44" data-y="0.2474999999999999" x="747.4832035832356" y="241.34264690199416" width="120.29433720806219" height="14.03433934094059" fill="#2563eb" stroke="black" stroke-width="0.0024938829787234038"/></g><g><rect data-type="rect" data-label="lower" data-x="1.64" data-y="0.047499999999999876" x="827.6794283886105" y="321.538871707369" width="120.29433720806219" height="14.034339340940562" fill="#9333ea" stroke="black" stroke-width="0.0024938829787234038"/></g><g><rect data-type="rect" data-label="lower" data-x="1.64" data-y="-0.1525000000000002" x="827.6794283886105" y="401.73509651274395" width="120.29433720806219" height="14.034339340940619" fill="#9333ea" stroke="black" stroke-width="0.0024938829787234038"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="230.21755358856774" cy="347.60264476911584" r="60.14716860403115" fill="#2563eb88" stroke="#2563eb" stroke-width="0.0024938829787234038"/><circle data-type="circle" data-label="" data-x="0.2" data-y="0" cx="310.4137783939426" cy="347.60264476911584" r="60.14716860403115" fill="#9333ea88" stroke="#9333ea" stroke-width="0.0024938829787234038"/><text data-type="text" data-label="Via-pair DRC count: 0" data-x="0.1" data-y="0.42" x="270.3156659912552" y="179.1905726778286" fill="black" font-size="24.05886744161246" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Via-pair DRC count: 0</text><text data-type="text" data-label="0.30 mm vias / 0.20 mm XY spacing" data-x="0.1" data-y="-0.38" x="270.3156659912552" y="499.9754718993281" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.30 mm vias / 0.20 mm XY spacing</text><text data-type="text" data-label="upper" data-x="-0.2" data-y="0.23" x="150.02132878319287" y="255.37698624293472" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">upper</text><text data-type="text" data-label="lower" data-x="0.4" data-y="0.23" x="390.6100031993175" y="255.37698624293472" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">lower</text><text data-type="text" data-label="top" data-x="0.95" data-y="0.4474999999999999" x="611.1496214140984" y="168.16359176708963" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">top</text><text data-type="text" data-label="inner1" data-x="0.95" data-y="0.2474999999999999" x="611.1496214140984" y="248.35981657246447" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">inner1</text><text data-type="text" data-label="inner2" data-x="0.95" data-y="0.047499999999999876" x="611.1496214140984" y="328.55604137783934" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">inner2</text><text data-type="text" data-label="bottom" data-x="0.95" data-y="-0.1525000000000002" x="611.1496214140984" y="408.75226618321426" fill="black" font-size="20.049056201343717" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">bottom</text><text data-type="text" data-label="No shared copper layer" data-x="1.54" data-y="0.6774999999999999" x="847.7284845899543" y="75.93793324090854" fill="black" font-size="24.05886744161246" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">No shared copper layer</text><text data-type="text" data-label="Layer spacing shown schematically" data-x="1.54" data-y="-0.38250000000000006" x="847.7284845899543" y="500.9779247093953" fill="black" font-size="18.044150581209344" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Layer spacing shown schematically</text><text data-type="text" data-label="XY projection" data-x="0.09999999999999998" data-y="0.509625" x="270.3156659912552" y="143.25263943692002" fill="black" font-size="23.90849952010238" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">XY projection</text><text data-type="text" data-label="Physical copper spans" data-x="1.425" data-y="0.7671249999999998" x="801.6156553268637" y="39.99999999999994" fill="black" font-size="23.90849952010238" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Physical copper spans</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="550" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '550');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":400.98112402687434,"c":0,"e":230.21755358856774,"b":0,"d":-400.98112402687434,"f":347.60264476911584};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>