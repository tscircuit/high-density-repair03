" data-label="" data-x="-4.4375" data-y="-0.600077" cx="1115.0729613733906" cy="545.6548889270385" r="5.076051502145923" fill="white" stroke="#1e40af" stroke-width="0.0023640422077922077"/><circle data-type="circle" data-label="" data-x="-4.4375" data-y="-0.800102" cx="1115.0729613733906" cy="630.2663224034334" r="9.306094420600859" fill="#15803d" stroke="white" stroke-width="0.0023640422077922077"/><text data-type="text" data-label="29" data-x="-6.40005" data-y="-0.800102" x="284.9058884120168" y="630.2663224034334" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">29</text><text data-type="text" data-label="30" data-x="-6.40005" data-y="-0.40005199999999996" x="284.9058884120168" y="461.0434554506437" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">30</text><text data-type="text" data-label="33 / terminal" data-x="-6" data-y="-0.990102" x="454.1287553648067" y="710.6371378540772" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">33 / terminal</text><text data-type="text" data-label="34" data-x="-6" data-y="-0.40005199999999996" x="454.1287553648067" y="461.0434554506437" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">34</text><text data-type="text" data-label="1 DRC error" data-x="-6.2" data-y="0.4" x="369.52789699570803" y="122.61802575107288" fill="#b91c1c" font-size="29.610300429184555" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 DRC error</text><text data-type="text" data-label="Copper crosses pad 34" data-x="-6.2" data-y="-1.14" x="369.52789699570803" y="774.044635193133" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper crosses pad 34</text><text data-type="text" data-label="29" data-x="-4.83755" data-y="-0.800102" x="945.8500944206007" y="630.2663224034334" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">29</text><text data-type="text" data-label="30" data-x="-4.83755" data-y="-0.40005199999999996" x="945.8500944206007" y="461.0434554506437" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">30</text><text data-type="text" data-label="33 / terminal" data-x="-4.4375" data-y="-0.990102" x="1115.0729613733906" y="710.6371378540772" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">33 / terminal</text><text data-type="text" data-label="34" data-x="-4.4375" data-y="-0.40005199999999996" x="1115.0729613733906" y="461.0434554506437" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">34</text><text data-type="text" data-label="0 DRC errors" data-x="-4.6375" data-y="0.4" x="1030.4721030042917" y="122.61802575107288" fill="#15803d" font-size="29.610300429184555" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0 DRC errors</text><text data-type="text" data-label="Interior bends enter the open channel" data-x="-4.6375" data-y="-1.14" x="1030.4721030042917" y="774.044635193133" fill="#334155" font-size="19.035193133047212" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Interior bends enter the open channel</text><text data-type="text" data-label="Before repair" data-x="-6.2" data-y="0.5953125" x="369.52789699570803" y="39.999999999999915" fill="black" font-size="29.74248927038627" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before repair</text><text data-type="text" data-label="After repair" data-x="-4.6375" data-y="0.5953125" x="1030.4721030042917" y="39.999999999999915" fill="black" font-size="29.74248927038627" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After repair</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="850" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '850');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":423.0042918454936,"c":0,"e":2992.1545064377683,"b":0,"d":-423.0042918454936,"f":291.8197424892703};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>