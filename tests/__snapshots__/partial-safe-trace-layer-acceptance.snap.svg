ta-x="7.5" data-y="2.525" x="869.2011019283746" y="81.32690541781452" fill="black" font-size="41.460055096418735" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Safe-layer candidate · 1 DRC</text><text data-type="text" data-label="Portfolio output · 4 DRC" data-x="15" data-y="2.525" x="1461.487603305785" y="81.32690541781452" fill="black" font-size="41.460055096418735" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Portfolio output · 4 DRC</text><g><circle data-type="point" data-label="foreign" data-x="0" data-y="-1" cx="276.9146005509641" cy="359.70156106519744" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="foreign" data-x="0" data-y="1" cx="276.9146005509641" cy="201.7584940312213" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="-2" data-y="0" cx="118.97153351698799" cy="280.73002754820936" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="2" data-y="0" cx="434.85766758494026" cy="280.73002754820936" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="foreign" data-x="7.5" data-y="-1" cx="869.2011019283746" cy="359.70156106519744" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="foreign" data-x="7.5" data-y="1" cx="869.2011019283746" cy="201.7584940312213" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="5.5" data-y="0" cx="711.2580348943984" cy="280.73002754820936" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="9.5" data-y="0" cx="1027.1441689623507" cy="280.73002754820936" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="foreign" data-x="15" data-y="-1" cx="1461.487603305785" cy="359.70156106519744" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="foreign" data-x="15" data-y="1" cx="1461.487603305785" cy="201.7584940312213" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="13" data-y="0" cx="1303.5445362718087" cy="280.73002754820936" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="trace" data-x="17" data-y="0" cx="1619.430670339761" cy="280.73002754820936" r="3" fill="#111827"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="520" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '520');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":78.97153351698806,"c":0,"e":276.9146005509641,"b":0,"d":-78.97153351698806,"f":280.73002754820936};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>