oints="516.3260025873221,350.4872789995688 516.3260025873221,321.5092712376024" fill="none" stroke="rgba(37, 99, 235, 0.42)" stroke-width="4.829667960327728"/></g><g><rect data-type="rect" data-label="board bounds" data-x="0" data-y="0" x="81.65588615782667" y="287.7015955153083" width="144.89003880983182" height="77.27468736524361" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.020705357142857143"/></g><g><rect data-type="rect" data-label="board bounds" data-x="3.75" data-y="0" x="262.76843467011645" y="287.7015955153083" width="144.89003880983182" height="77.27468736524361" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.020705357142857143"/></g><g><rect data-type="rect" data-label="board bounds" data-x="7.5" data-y="0" x="443.8809831824062" y="287.7015955153083" width="144.89003880983182" height="77.27468736524361" fill="rgba(255, 255, 255, 0)" stroke="#0f172a" stroke-width="0.020705357142857143"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0.1465" cx="154.10090556274258" cy="319.26347563605003" r="10.625269512721001" fill="rgba(147, 51, 234, 0.38)" stroke="#7e22ce" stroke-width="0.020705357142857143"/><circle data-type="circle" data-label="" data-x="7.5" data-y="0.1465" cx="516.3260025873221" cy="319.26347563605003" r="10.625269512721001" fill="rgba(34, 197, 94, 0.42)" stroke="#16a34a" stroke-width="0.020705357142857143"/><text data-type="text" data-label="Before: locked trace collision" data-x="0" data-y="1.0625" x="154.10090556274258" y="275.023717119448" fill="black" font-size="12.677878395860285" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before: locked trace collision</text><text data-type="text" data-label="Local terminal-safe detour" data-x="3.75" data-y="1.0625" x="335.21345407503236" y="275.023717119448" fill="black" font-size="12.677878395860285" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Local terminal-safe detour</text><text data-type="text" data-label="After: zero DRC errors" data-x="7.5" data-y="1.0625" x="516.3260025873221" y="275.023717119448" fill="black" font-size="12.677878395860285" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">After: zero DRC errors</text><g><circle data-type="point" data-label="locked_horizontal" data-x="-1" data-y="0.193" cx="105.8042259594653" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="locked_horizontal" data-x="1" data-y="0.193" cx="202.39758516601987" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="0" data-y="-0.5" cx="154.10090556274258" cy="350.4872789995688" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="0" data-y="0.1" cx="154.10090556274258" cy="321.5092712376024" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="locked_horizontal" data-x="2.75" data-y="0.193" cx="286.9167744717551" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="locked_horizontal" data-x="4.75" data-y="0.193" cx="383.51013367830967" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="3.75" data-y="-0.5" cx="335.21345407503236" cy="350.4872789995688" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="3.75" data-y="0.1" cx="335.21345407503236" cy="321.5092712376024" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="locked_horizontal" data-x="6.5" data-y="0.193" cx="468.0293229840449" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="locked_horizontal" data-x="8.5" data-y="0.193" cx="564.6226821905994" cy="317.01768003449763" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="7.5" data-y="-0.5" cx="516.3260025873221" cy="350.4872789995688" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="vertical" data-x="7.5" data-y="0.1" cx="516.3260025873221" cy="321.5092712376024" r="3" fill="#111827"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":48.296679603277276,"c":0,"e":154.10090556274258,"b":0,"d":-48.296679603277276,"f":326.33893919793013};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
