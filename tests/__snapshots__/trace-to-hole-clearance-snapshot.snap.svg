a-label="" data-x="7.45" data-y="0" cx="603.0204081632653" cy="203.43877551020407" r="32.326530612244895" fill="#e2e8f0" stroke="#475569" stroke-width="0.018560606060606062"/><circle data-type="circle" data-label="" data-x="16.2" data-y="0" cx="1074.4489795918366" cy="203.43877551020407" r="32.326530612244895" fill="#e2e8f0" stroke="#475569" stroke-width="0.018560606060606062"/><text data-type="text" data-label="0.1 mm gap" data-x="2.7" data-y="0.76" x="347.10204081632656" y="162.49183673469386" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.1 mm gap</text><text data-type="text" data-label="0.3 mm gap" data-x="2.7" data-y="0.96" x="347.10204081632656" y="151.71632653061224" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.3 mm gap</text><text data-type="text" data-label="0.6 mm gap" data-x="2.7" data-y="1.26" x="347.10204081632656" y="135.5530612244898" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.6 mm gap</text><text data-type="text" data-label="Red: below clearance / Green: clear" data-x="0.5" data-y="-0.85" x="228.5714285714286" y="249.234693877551" fill="black" font-size="10.775510204081634" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: below clearance / Green: clear</text><text data-type="text" data-label="0.1 mm gap" data-x="11.45" data-y="0.76" x="818.5306122448978" y="162.49183673469386" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.1 mm gap</text><text data-type="text" data-label="0.3 mm gap" data-x="11.45" data-y="0.96" x="818.5306122448978" y="151.71632653061224" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.3 mm gap</text><text data-type="text" data-label="0.6 mm gap" data-x="11.45" data-y="1.26" x="818.5306122448978" y="135.5530612244898" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.6 mm gap</text><text data-type="text" data-label="Red: below clearance / Green: clear" data-x="9.25" data-y="-0.85" x="700" y="249.234693877551" fill="black" font-size="10.775510204081634" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: below clearance / Green: clear</text><text data-type="text" data-label="0.1 mm gap" data-x="20.2" data-y="0.76" x="1289.9591836734694" y="162.49183673469386" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.1 mm gap</text><text data-type="text" data-label="0.3 mm gap" data-x="20.2" data-y="0.96" x="1289.9591836734694" y="151.71632653061224" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.3 mm gap</text><text data-type="text" data-label="0.6 mm gap" data-x="20.2" data-y="1.26" x="1289.9591836734694" y="135.5530612244898" fill="black" font-size="8.620408163265306" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.6 mm gap</text><text data-type="text" data-label="Red: below clearance / Green: clear" data-x="18" data-y="-0.85" x="1171.4285714285716" y="249.234693877551" fill="black" font-size="10.775510204081634" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: below clearance / Green: clear</text><text data-type="text" data-label="0.0 mm clearance" data-x="0.5" data-y="2.6125" x="228.5714285714286" y="62.68367346938774" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.0 mm clearance</text><text data-type="text" data-label="0.2 mm clearance" data-x="9.25" data-y="2.6125" x="700" y="62.68367346938774" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.2 mm clearance</text><text data-type="text" data-label="0.5 mm clearance" data-x="18" data-y="2.6125" x="1171.4285714285716" y="62.68367346938774" fill="black" font-size="33" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.5 mm clearance</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="320" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '320');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":53.87755102040816,"c":0,"e":201.63265306122452,"b":0,"d":-53.87755102040816,"f":203.43877551020407};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>