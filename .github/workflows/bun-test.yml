name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --no-save
      - run: bun test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-snapshots
          path: tests/__snapshots__/*.svg
