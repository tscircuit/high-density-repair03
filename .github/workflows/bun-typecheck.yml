name: Typecheck

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun install --no-save --cwd tests/fixtures/usb-terminal-clearance
      - run: bun run typecheck
